<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="mobile-web-app-capable" content="yes">
  <title>כניסה · AutoParts Workshop</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-visual" aria-hidden="true">
      <div class="visual-grid"></div>
      <div class="brand-lockup"><img src="assets/icons/app-icon.svg" alt=""><span>AUTOPARTS</span></div>
      <div class="mechanic-scene">
        <span class="scene-ring ring-one"></span><span class="scene-ring ring-two"></span>
        <img class="scene-main" src="assets/images/hero-mechanic.svg" alt="">
        <img class="scene-bolt" src="assets/images/bolt.svg" alt="">
        <img class="scene-nut" src="assets/images/nut.svg" alt="">
      </div>
      <div class="visual-copy"><span>WORKSHOP CONTROL</span><h1>המלאי שלך.<br>בכל מסך בסדנה.</h1><p>מחשב אחד שומר את הנתונים. הטלפון מתחבר אליו בצורה מאובטחת.</p></div>
    </section>

    <section class="auth-panel">
      <div class="mobile-brand"><img src="assets/icons/app-icon.svg" alt=""><span>AUTOPARTS WORKSHOP</span></div>
      <div class="auth-card">
        <span id="formKicker" class="form-kicker">גישה מאובטחת</span>
        <h2 id="formTitle">כניסה למערכת</h2>
        <p id="formDescription">היכנס עם אותו חשבון מהמחשב ומהטלפון.</p>

        <form id="authForm" novalidate>
          <label>דואר אלקטרוני<input id="email" type="email" autocomplete="email" maxlength="120" required></label>
          <label>סיסמה
            <span class="password-field"><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required><button id="togglePassword" type="button" aria-label="הצג או הסתר סיסמה">הצג</button></span>
          </label>
          <label id="confirmLabel" class="hidden">אימות סיסמה<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128"></label>
          <div id="authError" class="auth-error" role="alert"></div>
          <button id="submitButton" class="submit-button" type="submit"><span>כניסה</span><i aria-hidden="true">←</i></button>
        </form>

        <button id="modeButton" class="auth-mode-button" type="button">אין חשבון? צור חשבון ראשון</button>

        <div class="security-note"><i aria-hidden="true"></i><span>המידע מוצפן בתעבורה ונשמר בענן Supabase.</span></div>
      </div>
      <footer><span id="computerName">SECURE CLOUD SYNC</span><span>גרסה 5.0</span></footer>
    </section>
  </main>
  <script src="js/cloud-config.js" defer></script>
  <script src="js/cloud-auth.js" defer></script>
  <script src="js/login.js" defer></script>
</body>
</html>
