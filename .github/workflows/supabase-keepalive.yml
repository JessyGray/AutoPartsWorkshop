name: Supabase keep-alive

# Free Supabase projects pause after 7 days without activity, which makes
# the login page fail with "Failed to fetch". A small query every 3 days
# keeps the project awake.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Supabase
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' web/js/cloud-config.js)
          KEY=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' web/js/cloud-config.js)
          # anon cannot read this table, so Postgres itself answers "permission denied" (42501).
          # That still counts as activity; a gateway or key error does not and fails the run.
          CODE=$(curl -sS -o body.json -w "%{http_code}" "$URL/rest/v1/workshop_states?select=owner_id&limit=1" -H "apikey: $KEY")
          echo "HTTP $CODE"; cat body.json; echo
          case "$CODE" in
            2??) exit 0 ;;
            401|403) grep -q '"42501"' body.json ;;
            *) exit 1 ;;
          esac
