name: Prepare source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract clean source
        run: |
          if [ ! -f AutoPartsWorkshop-source.zip ]; then exit 0; fi
          unzip -o AutoPartsWorkshop-source.zip
          rm AutoPartsWorkshop-source.zip
      - name: Commit source tree
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add AutoParts Workshop cloud source"
          git push
